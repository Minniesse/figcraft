[package]
name = "figcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigCraft command line: info, export, convert, render, scripted commands, MCP server, perf"

[[bin]]
name = "figcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = ["collab", "font-download", "plugins"]
collab = ["figcraft-engine/collab", "figcraft-mcp/collab"]
font-download = ["figcraft-engine/font-download", "figcraft-mcp/font-download"]
# `figcraft-cli plugin publish`.
plugins = ["figcraft-engine/plugins", "figcraft-mcp/plugins"]

[dependencies]
figcraft-engine = { workspace = true }
figcraft-doc = { workspace = true }
figcraft-render = { workspace = true }
figcraft-text = { workspace = true }
figcraft-svg = { workspace = true }
figcraft-format = { workspace = true }
figcraft-mcp = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# 4.6 breaks Bash subcommand completion for hyphenated binary names (clap-rs/clap#6421).
clap_complete = "~4.5.67"
clap_mangen = "0.3"

[package]
name = "figcraft-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigCraft MCP server: JSON-RPC 2.0 over stdio, driving a headless engine session or a running FigCraft app"

[lints]
workspace = true

[features]
default = ["collab", "font-download"]
# The headless session's network link for live sessions (figcraft-collab-net: WebSocket and TLS client).
collab = ["dep:figcraft-collab-net", "figcraft-engine/collab"]
font-download = ["figcraft-engine/font-download"]

[dependencies]
figcraft-engine = { workspace = true }
figcraft-collab-net = { workspace = true, optional = true }
figcraft-doc = { workspace = true }
figcraft-geom = { workspace = true }
figcraft-render = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
log = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
image = { workspace = true }
